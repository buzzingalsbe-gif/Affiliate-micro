name: pages-fix-build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    name: Build and deploy Pages from repo root
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Jekyll and dependencies
        run: |
          gem install bundler
          bundle init
          echo "gem 'jekyll'" >> Gemfile
          echo "gem 'jekyll-sass-converter'" >> Gemfile
          bundle install

      - name: Build site from repo root
        run: |
          bundle exec jekyll build --source . --destination _site --future --verbose

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          token: ${{ secrets.GITHUB_TOKEN }}
